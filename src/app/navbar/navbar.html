<div class="sidebar">
  <nav class="nav flex-column mb-auto">
    <div class="sidebar-brand">FF<span class="punct">/</span>313</div>

    <a
      id="home"
      class="nav-link d-flex align-items-center"
      routerLink="/dashboard"
      data-label="Home"
    >
      <img id="home-img" src="/images/nav/home.svg" alt="Home" />
    </a>
    <a
      id="subscription"
      class="nav-link d-flex align-items-center"
      routerLink="/subscription"
      data-label="Subscriptions"
    >
      <img id="subscriptions-img" src="/images/nav/calendarClock.svg" alt="Subscriptions" />
    </a>
    <a
      id="loan"
      class="nav-link d-flex align-items-center"
      routerLink="/loan"
      data-label="loan"
    >
      <img id="subscriptions-img" src="/images/nav/loans.svg" alt="loans" />
    </a>
    <a
      id="transactions"
      class="nav-link d-flex align-items-center"
      routerLink="/transactions"
      data-label="Transactions"
    >
      <img id="transactions-img" src="/images/nav/card.svg" alt="Transactions" />
    </a>
    <a
      id="budgets"
      class="nav-link d-flex align-items-center"
      routerLink="/budgets"
      data-label="budgets"
    >
      <img id="budgets-img" src="/images/nav/chart.svg" alt="budgets" />
    </a>
    <a
      id="settings"
      class="nav-link d-flex align-items-center"
      routerLink="/settings"
      data-label="Settings"
    >
      <img id="settings-img" src="/images/nav/settings.svg" alt="Settings" />
    </a>
    <div class="login-logout">
      @if (authService.currentUser() != null) {
        <button
          id="logout"
          class="nav-link d-flex align-items-center nav-action"
          type="button"
          data-label="Logout"
          (click)="authService.logout()"
        >
          <img id="logout-img" src="/images/nav/logout.svg" alt="Logout" />
        </button>
      } @else {
        <a
          id="login"
          class="nav-link d-flex align-items-center nav-action"
          routerLink=""
          data-label="Login"
        >
          <img id="login-img" src="/images/nav/login.svg" alt="Login" />
        </a>
      }
    </div>
  </nav>
</div>
