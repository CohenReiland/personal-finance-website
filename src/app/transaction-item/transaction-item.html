<tr>
  <td>{{ transaction().Name }}</td>
  <td>
    <div class="cat">{{ transaction().Category }}</div>
  </td>
  <td
    class="num feed-amt"
    [class.neg]="transaction().Type === 'Expense'"
    [class.pos]="transaction().Type === 'Income'"
  >
    {{ transaction().Type === 'Expense' ? '−' : '+' }}${{ transaction().Amount }}
  </td>
  <td>{{ transaction().Date }}</td>
  <td class="actions">
    <div class="action-group">
      <button
        class="btn btn-ghost action-btn"
        type="button"
        (click)="editRequested.emit(transaction())"
      >
        Edit
      </button>
      <button
        class="btn btn-danger action-btn"
        type="button"
        (click)="deleteRequested.emit(transaction())"
      >
        Delete
      </button>
    </div>
  </td>
</tr>
